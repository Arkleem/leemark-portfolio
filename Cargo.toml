[package]
name = "leptos-portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "Event",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "Window",
     "Performance",
      "HtmlCanvasElement",
       "CanvasRenderingContext2d",

]
